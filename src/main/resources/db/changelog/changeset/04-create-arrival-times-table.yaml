databaseChangeLog:
  - changeSet:
      id: 04-create-arrival-times-table
      author: Yaraslau Haponenka
      changes:
        - createTable:
            tableName: arrival_times
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_arrival_times
                    nullable: false
                  autoIncrement: true
              - column:
                  name: hotel_id
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_arrival_times_hotels
                    referencedTableName: hotels
                    referencedColumnNames: id
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_arrival_times_hotel_id
                    deleteCascade: true
              - column:
                  name: check_in
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: check_out
                  type: VARCHAR(10)
                  constraints:
                    nullable: true
