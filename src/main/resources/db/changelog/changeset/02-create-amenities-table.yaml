databaseChangeLog:
  - changeSet:
      id: 02-create-amenities-table
      author: Yaraslau Haponenka
      changes:
        - createTable:
            tableName: amenities
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_amenities
                    nullable: false
                  autoIncrement: true
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    unique: true
                    uniqueConstraintName: uq_amenities_name
                    nullable: false