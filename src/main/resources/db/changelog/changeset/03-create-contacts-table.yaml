databaseChangeLog:
  - changeSet:
      id: 03-create-contacts-table
      author: Yaraslau Haponenka
      changes:
        - createTable:
            tableName: contacts
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_contacts
                    nullable: false
                  autoIncrement: true
              - column:
                  name: hotel_id
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_contacts_hotels
                    referencedTableName: hotels
                    referencedColumnNames: id
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_contacts_hotel_id
                    deleteCascade: true
              - column:
                  name: phone
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false