databaseChangeLog:
  - changeSet:
      id: 05-create-addresses-table
      author: Yaraslau Haponenka
      changes:
        - createTable:
            tableName: addresses
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_addresses
                    nullable: false
                  autoIncrement: true
              - column:
                  name: hotel_id
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_addresses_hotels
                    referencedTableName: hotels
                    referencedColumnNames: id
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_addresses_hotel_id
                    deleteCascade: true
              - column:
                  name: house_number
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: street
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: city
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: country
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: post_code
                  type: VARCHAR(255)
                  constraints:
                    nullable: false


