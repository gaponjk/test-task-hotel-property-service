databaseChangeLog:
  - changeSet:
      id: 01-create-hotels-table
      author: Yaraslau Haponenka
      changes:
        - createTable:
            tableName: hotels
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_hotels
                    nullable: false
                  autoIncrement: true
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
                  constraints:
                    nullable: true
              - column:
                  name: brand
                  type: VARCHAR(255)
                  constraints:
                    nullable: false